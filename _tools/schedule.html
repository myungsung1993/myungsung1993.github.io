<title>지원길 운영 일정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 휴대폰 한 줄 목록: 오늘 → 3일 안 → 이후 → 매일·매주 → 지난 일. 날짜는 열람 시점 기준으로 자동 분류 */
:root{
  --bg:#f3f6fa; --card:#ffffff; --fg:#17212e; --muted:#5f6b7b; --line:#dde4ec;
  --brand:#1a6fd1; --brand-soft:#e6f0fc; --me:#b4560f; --me-soft:#fdf0e3; --done:#8a96a6;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161d; --card:#1a212b; --fg:#e7edf4; --muted:#9aa6b6; --line:#2b3542;
  --brand:#6aa8f5; --brand-soft:#1c2d44; --me:#f0a35e; --me-soft:#3a2a1a; --done:#6c7888; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --card:#1a212b; --fg:#e7edf4; --muted:#9aa6b6; --line:#2b3542;
  --brand:#6aa8f5; --brand-soft:#1c2d44; --me:#f0a35e; --me-soft:#3a2a1a; --done:#6c7888; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:22px}
header{display:grid;gap:4px}
h1{margin:0;font-size:22px;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
h2{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
section.today h2{color:var(--brand)}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
li:first-child{border-top:0}
.d{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;color:var(--brand)}
.d small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.t{min-width:0}
.who{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;vertical-align:1px;white-space:nowrap}
.who.me{background:var(--me-soft);color:var(--me)}
.who.cl{background:var(--brand-soft);color:var(--brand)}
li.mine{box-shadow:inset 3px 0 0 var(--me)}
.empty{padding:14px;color:var(--muted)}
.plain li{grid-template-columns:1fr}
section.past li{color:var(--done)}
section.past .d{color:var(--done)}
details summary{cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <h1>지원길 운영 일정</h1>
    <div class="sub" id="now">오늘 날짜 기준으로 자동 정리돼요</div>
    <div class="legend"><span><span class="who me">직접</span> 내가 할 일</span><span><span class="who cl">Claude</span> Claude가 할 일</span></div>
  </header>

  <section class="today"><h2>오늘</h2><ul id="today"></ul></section>
  <section><h2>3일 안에</h2><ul id="soon"></ul></section>
  <section><h2>그 뒤</h2><ul id="later"></ul></section>

  <section class="plain"><h2>매일 (작업 시작할 때)</h2><ul id="daily"></ul></section>
  <section class="plain"><h2>매주</h2><ul id="weekly"></ul></section>

  <section class="past"><details><summary>지난 일</summary><ul id="past"></ul></details></section>
  <div class="sub" id="upd"></div>
</div>

<script>
// 수정할 곳: UPDATED와 EVENTS만 바꿔서 같은 주소로 다시 게시한다. (원본: _schedule.md)
const UPDATED = "2026-11-05";
// who: "me"=사용자 직접, "cl"=Claude, ""=표시만. end가 있으면 기간 일정
const EVENTS = [
  {d:"2026-11-05", t:"주거급여 2027 갱신·robots 메타·스포츠 2027 인스타 릴스·네이버 블로그 개설, 스포츠·문화누리 게시", who:"", done:true},
  {d:"2026-11-05", t:"쓰레드 청년미래적금 밤 게시 (\"올려줘\" 하면)", who:"me"},
  {d:"2026-11-06", t:"네이버 에너지바우처 예약 발행 확인", who:"cl"},
  {d:"2026-11-07", t:"네이버 모두의카드 예약 발행 확인", who:"cl"},
  {d:"2026-11-08", t:"네이버 다음 묶음 3개 준비 → 예약 (11/9부터 하루 1개 이하)", who:"me"},
  {d:"2026-11-09", t:"스포츠강좌이용권 2027 신청 시작 — \"오늘부터 신청\" 소식 올리기", who:"cl"},
  {d:"2026-11-10", t:"애드센스 결과 확인 (승인: 소개 문구 수정 / 반려: 사유별 보완)", who:"cl"},
  {d:"2026-11-16", t:"청년미래적금 2차 계좌 개설 시작 (~11/27) — 쓰레드 소식", who:"cl"},
  {d:"2026-11-18", t:"구글 서치 콘솔 노출 숫자 확인", who:"me"},
  {d:"2026-11-19", t:"네이버 블로그 2주 점검: GA4 유입 숫자", who:"cl"},
  {d:"2026-11-27", t:"스포츠강좌이용권 신청 마감 · 청년미래적금 2차 계좌 개설 마감", who:""},
  {d:"2026-11-28", t:"스포츠·청년미래적금 카드 \"신청기간 만료\" 도장 + 인스타·쓰레드 마감 안내 댓글", who:"cl"},
  {d:"2026-11-30", t:"문화누리카드 발급 마감 · 월간 점검(쓰레드 숫자, 채널별 유입)", who:"cl"},
  {d:"2026-12-01", t:"문화누리 도장·마감 안내 · 근로장려금 기한 후 신청 마감", who:"cl"},
  {d:"2026-12-10", t:"인스타 토큰 갱신 (안 하면 12/20쯤 업로드 끊김)", who:"cl"},
  {d:"2026-12-13", t:"쓰레드 토큰 갱신", who:"cl"},
  {d:"2026-12-15", t:"2027 고시 나오는 대로 갱신: 생계급여 → 기초연금·장애인연금 → 긴급복지 → 실업급여·육아휴직 → 생활비 허브 (12월 중)", who:"cl"},
  {d:"2026-12-31", t:"에너지바우처 신청 마감 (12월 말 2~3일 신청 중단)", who:""},
  {d:"2027-01-01", t:"에너지바우처 도장 · 2027년 기준 적용 시작(주거급여 등)", who:"cl"},
];
const DAILY = [
  ["애드센스 결과 메일 확인","cl"],["마감 점검 · 도장·마감 안내 댓글","cl"],["정책뉴스 점검(새 주제·제도 변경)","cl"],
  ["인스타 1개 (세트 + 릴스)","cl"],["쓰레드 3개: 오전 새 주제 · 점심 · 밤 9시쯤","cl"],["쓰레드 댓글 답글","cl"],
  ["블로그 새 글·갱신 0~1개","cl"],["\"올려줘\"로 시작 신호 주기","me"]];
const WEEKLY = [["네이버 블로그 3개 묶음 원고 준비","cl"],["네이버 3개 붙여넣고 예약 (약 15분)","me"],["발행된 네이버 글 대조 확인","cl"]];

const WD="일월화수목금토";
const pad=n=>String(n).padStart(2,"0");
const now=new Date(); const today=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const days=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);
const badge=w=>w==="me"?'<span class="who me">직접</span>':w==="cl"?'<span class="who cl">Claude</span>':"";
function row(e){
  const dt=new Date(e.d+"T00:00:00"); const left=days(today,e.d);
  const hint=left===0?"오늘":left>0?`D-${left}`:`${-left}일 전`;
  return `<li class="${e.who==="me"?"mine":""}"><div class="d">${dt.getMonth()+1}/${dt.getDate()}(${WD[dt.getDay()]})<small>${hint}</small></div><div class="t">${e.t}${badge(e.who)}</div></li>`;
}
function fill(id,list,fn){document.getElementById(id).innerHTML=list.length?list.map(fn).join(""):'<li class="empty">없어요</li>';}
const open=EVENTS.filter(e=>!e.done), past=EVENTS.filter(e=>e.done||days(today,e.d)<0);
fill("today",open.filter(e=>days(today,e.d)===0),row);
fill("soon",open.filter(e=>{const x=days(today,e.d);return x>=1&&x<=3}),row);
fill("later",open.filter(e=>days(today,e.d)>3),row);
fill("past",past.slice().reverse(),row);
const plain=([t,w])=>`<li class="${w==="me"?"mine":""}"><div class="t">${t}${badge(w)}</div></li>`;
fill("daily",DAILY,plain); fill("weekly",WEEKLY,plain);
document.getElementById("now").textContent=`${now.getMonth()+1}월 ${now.getDate()}일(${WD[now.getDay()]}) 기준으로 자동 정리돼요`;
document.getElementById("upd").textContent=`일정 마지막 수정: ${UPDATED} · 지난 날짜의 미완료 일도 "지난 일"에 들어가요`;
</script>
