<!doctype html><html><body><pre id="out"></pre>
<script>
// 검사할 글 주소(/YYYY/MM/DD/ 다음 부분). 새 글을 쓰면 여기에 추가
const posts=["2026/10/14/ev-purchase-subsidy-2026","2026/10/14/birth-support-2026","2026/10/14/leave-pay-2026","2026/10/14/startup-support-2026","2026/10/14/pre-startup-package-2026","2026/10/14/early-startup-package-2026","2026/10/14/youth-startup-academy-2026","2026/10/14/small-business-policy-loan-2026","2026/10/14/startup-tax-reduction-2026","2026/10/16/youth-monthly-rent-2026","2026/10/16/youth-jeonse-loan-2026","2026/10/16/youth-wolse-loan-2026","2026/10/16/youth-housing-support-2026","2026/10/16/youth-dream-account-2026","2026/10/16/youth-public-rental-2026","2026/10/16/child-care-service-2026","2026/10/16/energy-voucher-2026","2026/10/17/culture-nuri-card-2026","2026/10/17/modu-card-kpass-2026","2026/10/18/tomorrow-learning-card-2026","2026/10/18/national-employment-support-2026","2026/10/19/reduced-hours-childcare-2026","2026/10/19/youth-future-savings-2026","2026/10/19/youth-tomorrow-savings-2026","2026/10/20/sports-voucher-2026","2026/10/21/hourly-childcare-2026","2026/10/22/emergency-welfare-support-2026","2026/10/23/housing-benefit-2026","2026/10/24/unemployment-benefit-2026","2026/10/24/livelihood-benefit-2026","2026/10/24/basic-pension-2026","2026/10/25/disability-pension-2026","2026/10/25/single-parent-child-support-2026","2026/10/26/child-support-advance-payment-2026","2026/10/26/diaper-formula-support-2026"];
const out=document.getElementById('out');
window.addEventListener('message',e=>{out.textContent+=e.data+"\n";});
posts.forEach(p=>{
  const url="https://jiwongil.kr/"+p+"/";
  fetch(url+"?c="+Date.now()).then(r=>r.text()).then(html=>{
    const probe=`<script>window.addEventListener('load',()=>setTimeout(()=>{
      const t=[...document.querySelectorAll('.post-content table')];
      const bad=t.map((x,i)=>[i+1,x.scrollWidth,x.clientWidth,(x.querySelector('th')||{}).textContent]).filter(a=>a[1]>a[2]+1);
      parent.postMessage('${p}: page='+document.documentElement.scrollWidth+'px tables='+t.length+' overflow='+JSON.stringify(bad),'*');
    },1500));<\/script>`;
    const f=document.createElement('iframe');
    f.style.width='390px';f.style.height='800px';
    f.srcdoc=html.replace('<head>','<head><base href="'+url+'">').replace('</body>',probe+'</body>');
    document.body.appendChild(f);
  }).catch(err=>out.textContent+=p+" ERROR "+err+"\n");
});
</script></body></html>
